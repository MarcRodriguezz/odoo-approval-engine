name: odoo-approval-engine

# Self-contained Odoo 19 stack to run the Approval & Rules Engine.
# The repository root (where the modules live) is mounted as the addons path,
# so a fresh checkout runs out of the box — no Enterprise needed.
#
#   cp .env.example .env        # optional: change the DB password
#   docker compose up -d
#   open http://localhost:8069  # create a DB, then install "Approval & Rules Engine"
#                               # (+ the Sales/Purchase/Invoicing/Expense integrations)

services:
  db:
    image: postgres:16
    container_name: approval-db
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-odoo}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "odoo", "-d", "postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  odoo:
    image: odoo:19
    container_name: approval-odoo
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8069:8069"   # web
      - "8072:8072"   # websocket (live notifications)
    environment:
      HOST: db
      PORT: 5432
      USER: odoo
      PASSWORD: ${POSTGRES_PASSWORD:-odoo}
    volumes:
      - odoo-data:/var/lib/odoo            # filestore
      - ./odoo.conf:/etc/odoo/odoo.conf    # config
      - ..:/mnt/extra-addons               # this repository = the modules
    restart: unless-stopped

volumes:
  db-data:
  odoo-data:
