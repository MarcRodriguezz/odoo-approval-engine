[options]
; Master password for the database manager (create/drop/backup at /web/database/manager)
admin_passwd = admin-change-me

; Addons: the mounted repository (these modules) + Odoo's stock addons.
addons_path = /mnt/extra-addons,/usr/lib/python3/dist-packages/odoo/addons

; Filestore (attachments, sessions) -> docker volume "odoo-data"
data_dir = /var/lib/odoo

; Show the database manager
list_db = True

; Logs to console (docker compose logs -f odoo)
logfile = None
log_level = info
